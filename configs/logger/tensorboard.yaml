# https://www.tensorflow.org/tensorboard/

tensorboard:
  _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
  save_dir: "${paths.log_dir}/tensorboard/"
  # Use only `experiment_name` here; the timestamp is already included in `hydra.run.dir`.
  name: "${oc.env:EXPERIMENT_NAME,${experiment_name}}"
  # Let TensorBoardLogger use `version/` to separate runs.
  version: null
  log_graph: False
  default_hp_metric: True
  prefix: ""
