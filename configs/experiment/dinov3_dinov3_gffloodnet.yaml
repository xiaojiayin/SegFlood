# @package _global_

# GF-FloodNet: DINOv3 双流（Optical+SAR）

defaults:
  - override /data: gf_floodnet
  - override /model: dinov3_dinov3
  - override /callbacks: default
  - override /logger: tensorboard
  - override /trainer: gpu

tags: ["dinov3", "gffloodnet", "dual_modal"]
seed: 42
experiment_name: "dinov3_dinov3_gffloodnet"

data:
  batch_size: 128
  num_workers: 8

trainer:
  max_epochs: 100
  check_val_every_n_epoch: 1
  precision: "bf16-mixed"

logger:
  tensorboard:
    save_dir: "${paths.log_dir}/tensorboard"
    name: "${experiment_name}"
    version: null

model:
  encoder:
    optical_channels: ${data.optical_channels}
    sar_channels: ${data.sar_channels}
    drop_path_rate: 0.2
    # 显式开启浅层细节编码器（主干为ViT时补充2x/4x/8x特征）
    shallow_enabled: true

  fusion:
    _target_: src.models.fusion.FeatureFusion
    fusion_type: "xattn"
    xattn_apply_levels: [-1, -2]
    xattn_reduction: 8
    xattn_gamma_init: 0.0
    # MA-XAttn: 对齐偏置（无损）
    xattn_align_bias: true
    xattn_align_bias_scale: 1
    

  decoder:
    _target_: src.models.decoders.UNetDecoder
    num_classes: 2
    dropout: 0.0

  loss_fn:
    _target_: segmentation_models_pytorch.losses.FocalLoss
    mode: "multiclass"
    alpha: [0.25, 0.75]
    gamma: 2.0
    reduction: "mean"
    _convert_: all

  aux_loss_fn:
    _target_: segmentation_models_pytorch.losses.DiceLoss
    mode: "multiclass"
    from_logits: true
    smooth: 1e-6
    _convert_: all

  aux_loss_weight: 0.3
  learning_rate: 5e-4
  weight_decay: 1e-4

  # 对齐正则：PatchNCE（r 邻域多正样本）
  alignment_enabled: true                 # 开启对齐正则
  alignment_target_weight: 0.05           # 权重（可先 0.02→0.05 暖启动）
  alignment_layers: [-1]              # 在两层同时对齐
  alignment_temperature: 0.08             # 温度 τ（0.07～0.1）
  alignment_num_samples: 256              # 采样位置 K（稳定些）
  alignment_patch_radius: 1               # PatchNCE 半径 r=1(3x3)

  # 对齐项 EMA 限幅比例
  align_cap_ratio: 0.3

