# @package _global_

# 早期融合 baseline 实验：SAM2 Hiera Base+ 单编码器
# CAU-Flood 数据集版本

defaults:
  - override /data: cau_flood
  - override /model: sam2_sam2
  - override /callbacks: default
  - override /logger: tensorboard
  - override /trainer: gpu

tags: ["early_fusion", "baseline", "sam2_small", "cauflood", "single_encoder"]
seed: 42
experiment_name: "sam2_early_fusion_cauflood"

data:
  modal_type: "dual"
  output_image_key: true
  batch_size: 128
  num_workers: 8

trainer:
  max_epochs: 100
  check_val_every_n_epoch: 1
  precision: "bf16-mixed"

logger:
  tensorboard:
    save_dir: "${paths.log_dir}/tensorboard"
    name: "${experiment_name}"
    version: null

model:
  encoder:
    optical_model_name: "sam2_hiera_small"
    sar_model_name: null
    optical_pretrained: true
    sar_pretrained: false
    # 早期融合：RGBNIR(4)+SAR(1)=5
    optical_channels: 5
    sar_channels: 0

  fusion:
    fusion_type: "concat"

  decoder:
    dropout: 0.0                        # 小数据集：关闭dropout
    up_mode: "bilinear"

  loss_fn:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: -1

  learning_rate: 5e-4
  weight_decay: 1e-4
  num_classes: 2


