# @package _global_

# WorldFloodsv2 纯 SAM2 主干实验（简化版本）

defaults:
  - override /data: worldfloodsv2
  - override /model: sam2_sam2
  - override /callbacks: default
  - override /logger: tensorboard
  - override /trainer: gpu

# 实验标识
tags: ["sam2", "worldfloodsv2"]
seed: 42
experiment_name: "sam2_sam2_worldfloodsv2"

# 数据配置
data:
  batch_size: 128
  num_workers: 8
  # 训练样本不过滤（云/无效像元已在标签侧以 ignore_index 处理）
  filter_windows:
    apply: false

# 训练配置
trainer:
  max_epochs: 50
  check_val_every_n_epoch: 1
  precision: "bf16-mixed"

# 日志配置
logger:
  tensorboard:
    save_dir: "${paths.log_dir}/tensorboard"
    name: "${experiment_name}"
    version: null

# 模型配置
model:
  encoder:
    optical_channels: ${data.optical_channels}
    sar_channels: ${data.sar_channels}
    drop_path_rate: 0.2

  loss_fn:
    _target_: segmentation_models_pytorch.losses.FocalLoss
    mode: "multiclass"
    alpha: [0.15, 0.85]
    gamma: 2.0
    reduction: "mean"
    ignore_index: -1
    _convert_: all
  
  aux_loss_fn:
    _target_: segmentation_models_pytorch.losses.DiceLoss
    mode: "multiclass"
    from_logits: true
    smooth: 1e-6
    ignore_index: -1
    _convert_: all
  
  aux_loss_weight: 0.3
  learning_rate: 5e-4
  weight_decay: 1e-4
  num_classes: 2

  decoder:
    dropout: 0.1

  


