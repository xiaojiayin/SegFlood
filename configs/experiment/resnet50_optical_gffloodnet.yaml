# @package _global_


# Experiment overrides (Hydra).


defaults:
  - override /data: gf_floodnet
  - override /model: resnet50_resnet50
  - override /callbacks: default
  - override /logger: tensorboard
  - override /trainer: gpu

tags: ["single_modal", "optical", "resnet50", "gffloodnet"]
seed: 42
experiment_name: "resnet50_optical_gffloodnet"

data:
  modal_type: "optical"
  batch_size: 128
  num_workers: 8

trainer:
  max_epochs: 100
  check_val_every_n_epoch: 1
  precision: "bf16-mixed"
  accumulate_grad_batches: 2

logger:
  tensorboard:
    save_dir: "${paths.log_dir}/tensorboard"
    name: "${experiment_name}"
    version: null

model:
  encoder:
    optical_channels: ${data.optical_channels}
    sar_channels: 0

  loss_fn:
    _target_: segmentation_models_pytorch.losses.FocalLoss
    mode: "multiclass"
    alpha: [0.15, 0.85]
    gamma: 2.0
    reduction: "mean"
    _convert_: all

  aux_loss_fn:
    _target_: segmentation_models_pytorch.losses.DiceLoss
    mode: "multiclass"
    from_logits: true
    smooth: 1e-6
    _convert_: all

  aux_loss_weight: 0.3
  learning_rate: 5e-4
  weight_decay: 1e-4


