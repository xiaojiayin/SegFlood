# @package _global_

# S1S2-Water 纯 SAM2 主干实验（简化版本）
#
# 使用 modal_type + add_dem/add_slope 控制
# DEM/SLOPE 总是添加到光学分支

defaults:
  - override /data: s1s2_water
  - override /model: sam2_sam2
  - override /callbacks: default
  - override /logger: tensorboard
  - override /trainer: gpu

# 实验标识
tags: ["dual_modal", "sam2", "sam2", "s1s2water"]
seed: 42
experiment_name: "sam2_sam2_s1s2water"

# 数据配置
data:
  modal_type: "dual"
  add_dem: false
  add_slope: false
  batch_size: 128
  num_workers: 8

# 训练配置
trainer:
  max_epochs: 50
  check_val_every_n_epoch: 1
  precision: "bf16-mixed"

# 日志配置
logger:
  tensorboard:
    save_dir: "${paths.log_dir}/tensorboard"
    name: "${experiment_name}"
    version: null

# 模型配置
model:
  encoder:
    optical_channels: ${data.optical_channels}
    sar_channels: ${data.sar_channels}
    drop_path_rate: 0.2                      # 大数据集+大模型

  # 跨模态注意力融合配置（双流实验标配）
  fusion:
    _target_: src.models.fusion.FeatureFusion
    fusion_type: "xattn"                    # 跨模态注意力融合；可改为 concat|add|gated|se|cbam|xattn
    # 在末两层做交互（-1,-2），对齐正则仍仅在最深层
    xattn_apply_levels: [-1, -2]
    xattn_reduction: 8                      # 注意力瓶颈缩减比 (越大越省算力)
    xattn_gamma_init: 0.0                   # 残差缩放初值 (0 表示从纯注意力输出开始)
    # MA-XAttn: 对齐偏置（无损）
    xattn_align_bias: true
    xattn_align_bias_scale: 1.0


  decoder:
    dropout: 0.1                             # 大数据集：适度dropout
    up_mode: "bilinear"                      # 标准双线性插值

  loss_fn:
    _target_: segmentation_models_pytorch.losses.FocalLoss
    mode: "multiclass"
    alpha: [0.15, 0.85]
    gamma: 2.0
    reduction: "mean"
    _convert_: all
  
  aux_loss_fn:
    _target_: segmentation_models_pytorch.losses.DiceLoss
    mode: "multiclass"
    from_logits: true
    smooth: 1e-6
    _convert_: all
  
  aux_loss_weight: 0.3
  learning_rate: 5e-4
  weight_decay: 1e-4



  # 对齐正则（SigLIP PatchNCE）：仅最深层，K=256，τ=0.08
  alignment_enabled: true
  alignment_target_weight: 0.05
  alignment_layers: [-1]
  alignment_temperature: 0.08
  alignment_num_samples: 256
  alignment_patch_radius: 1
  # EMA 限幅比例（防止对齐项主导）
  align_cap_ratio: 0.9

  