# @package _global_

# 早期融合 baseline 实验：单编码器处理所有通道（光学+SAR）
# S1S2-Water数据集版本

defaults:
  - override /data: s1s2_water
  - override /model: resnet50_resnet50
  - override /callbacks: default
  - override /logger: tensorboard
  - override /trainer: gpu

# 实验标识
tags: ["early_fusion", "baseline", "resnet50", "s1s2water", "single_encoder"]
seed: 42
experiment_name: "resnet50_early_fusion_s1s2water"

# 数据配置：早期融合模式
data:
  modal_type: "dual"                    # 仍然加载双模态数据
  output_image_key: true                # 🎯 关键：强制输出单键image
  batch_size: 32
  num_workers: 8
  add_dem: false                        # 不使用DEM
  add_slope: false                      # 不使用SLOPE

# 训练配置
trainer:
  max_epochs: 50
  check_val_every_n_epoch: 1
  precision: "bf16-mixed"

# 日志配置
logger:
  tensorboard:
    save_dir: "${paths.log_dir}/tensorboard"
    name: "${experiment_name}"
    version: null

# 模型配置：单编码器早期融合
model:
  encoder:
    # 🎯 关键配置：只启用光学编码器，处理所有通道
    optical_model_name: "resnet50"
    optical_pretrained: true
    # 早期融合：RGBNIR(4)+SAR(VV+VH 2)=6
    optical_channels: 6
    
    # 禁用SAR编码器（早期融合不需要双流）
    sar_model_name: null
    sar_pretrained: false
    # 早期融合禁用第二编码器
    sar_channels: 0
    
    drop_path_rate: 0.1                 # 适度正则化

  # 融合模块配置（单流时会自动走单模态投影路径）
  fusion:
    fusion_type: "concat"               # 保持与双流实验一致的配置

  # 解码器配置
  decoder:
    dropout: 0.1                        # 适度dropout
    up_mode: "bilinear"                 # 双线性上采样

  # 损失函数配置
  loss_fn:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: -1
  learning_rate: 5e-4
  weight_decay: 1e-4



# 🎯 实验说明
# 此配置实现S1S2-Water数据集上的"早期融合"baseline：
# 1. 数据层面：output_image_key=true 强制输出单键image=[B,6,H,W]
# 2. 模型层面：只用光学编码器，in_chans=6 处理所有通道（RGB+NIR+VV+VH）
# 3. 对比目标：与双流晚期融合（resnet50_dual_s1s2water）进行性能对比
# 4. 数据特点：S1S2-Water包含Sentinel-1 SAR (VV+VH) 和 Sentinel-2 光学数据
